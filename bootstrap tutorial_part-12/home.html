<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <!--
    Default
    primary
    secondary
    success
    danger
    warning
    info
    light
    dark
  
   -->
  <form action="" class="m-2 p-3 border border-warning">
    <div class="mb-3">
      <label for="">Name</label>
      <input type="text" placeholder="Enter Your Name" class="form-control">
    </div>
    <div class="mb-3">
      <label for="">Email</label>
      <input type="email" placeholder="Enter Your Email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="">Contact</label>
      <input type="number" placeholder="Enter Your Number" class="form-control" required>
    </div>
    <div class="form-text mb-3">
      Hey this is bijoy dutta a web developer
    </div>
    <div class="mb-3">
      <label for="">Textarea</label>
      <textarea name="" rows="10" cols="30" class="form-control" placeholder="Message"></textarea>
    </div>
    <div class="mb-3">
      <select name="" id="" class="form-select">
        <option value="1">Select</option>
        <option value="2">one</option>
        <option value="3">Three</option>
      </select>
    </div>
    <button class="btn btn-warning">Submit</button>
  </form>

  <form action="" class="m-2 p-3 border border-primary">
    <div class="mb-3">
      <label for="">Email</label>
      <input type="email" placeholder="Enter Your email" class="form-control">
    </div>
    <div class="mb-3">
      <label for="">Password</label>
      <input type="password" placeholder="Enter Your password" class="form-control" required>
    </div>
    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input">
      <label for="">Password</label>
    </div>
    <div class="mb-3 form-switch">
      <input type="checkbox" class="form-check-input">
      <label for="">Password</label>
    </div>
    <div class="mb-3 form-radio">
      <input type="radio" class="form-radio-input">
      <label for="">Password</label>
    </div>
    <div class="mb-3">
      <input type="range" class="form-range" max="10" min="0">
      <label for="">Password</label>
    </div>
    <div class="mb-3">
      <input type="color" class="form-control form-control-color">
      <label for="">ColorPicker</label>
    </div>
  
    <button class="btn btn-primary">Submit</button>
  </form>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
